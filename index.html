<!DOCTYPE html>
<html lang="en">
<head>

<title>Portfolio · Fernando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #A07868; --bg-soft: #B89384;
  --card: #FFFFFF; --card-soft: #FAF6F2; --card-cream: #F4ECE3;
  --text: #2A201A; --text-2: #6B5D52; --text-3: #A89A8E;
  --border: rgba(42,32,26,0.08); --border-2: rgba(42,32,26,0.04);
  --coral: #E07856; --coral-soft: #FBE4DA;
  --teal: #4D9C8C; --teal-soft: #DCEFEB;
  --gold: #C49960; --gold-soft: #F5E8D2;
  --slate: #7E8FA0; --slate-soft: #E0E6EC;
  --mauve: #A87BAB; --mauve-soft: #ECE0EE;
  --up: #5FA070; --up-soft: #DCEFE0;
  --down: #D6736E; --down-soft: #F8DEDC;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;overscroll-behavior:none}
.app{max-width:480px;margin:0 auto;padding:max(env(safe-area-inset-top),20px) 16px max(env(safe-area-inset-bottom),28px)}
@media(min-width:720px){.app{max-width:720px;padding:32px 24px 48px}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;color:#fff}
.greeting{font-size:13px;opacity:.75;letter-spacing:.01em}
.greeting strong{display:block;font-size:18px;font-weight:700;opacity:1;margin-top:2px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:100px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:none;cursor:pointer;color:#fff;padding:0;transition:all .18s}
.icon-btn:active{transform:scale(.95);background:rgba(255,255,255,.25)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.spinning svg{animation:spin .9s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.live-badge{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 10px;border-radius:100px;font-size:11px;font-weight:600;color:#fff}
.live-dot{width:6px;height:6px;border-radius:50%;background:#7FE095;box-shadow:0 0 8px rgba(127,224,149,.7);animation:pulse 2.4s ease-in-out infinite}
.live-dot.stale{background:#E0B870;box-shadow:0 0 8px rgba(224,184,112,.7)}
.live-dot.error{background:#E07878;box-shadow:0 0 8px rgba(224,120,120,.7);animation:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;color:rgba(255,255,255,.85)}
.loading-state .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite;margin-bottom:16px}
.loading-state .label{font-size:13px;font-weight:600;opacity:.85}
.error-card{background:var(--card);border-radius:20px;padding:22px;margin-bottom:14px;border-left:3px solid var(--down);box-shadow:0 1px 3px rgba(42,32,26,.08),0 8px 24px rgba(42,32,26,.04)}
.error-title{font-size:14px;font-weight:800;color:var(--down);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.error-msg{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:14px}
.error-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{font-family:inherit;font-weight:700;font-size:12px;padding:8px 14px;border-radius:100px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-primary{background:var(--coral);color:#fff}
.btn-secondary{background:var(--card-soft);color:var(--text)}
.error-debug{background:var(--card-soft);border-radius:10px;padding:12px;font-family:"Inter",monospace;font-size:10px;color:var(--text-2);max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(42,32,26,.08),0 8px 24px rgba(42,32,26,.04)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.card-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.card-action{font-size:11px;font-weight:600;color:var(--text-2)}
.hero{padding:24px 22px}
.hero-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}

.hero-brl{font-family:"Inter",sans-serif;font-size:13px;font-weight:600;color:var(--text-3);margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hero-row{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:100px;font-size:12px;font-weight:700;font-family:"Inter",sans-serif}
.pill-up{background:var(--up-soft);color:var(--up)}
.pill-down{background:var(--down-soft);color:var(--down)}
.pill-arrow{font-size:10px}
.hero-pl-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-top:18px;margin-bottom:8px}
.hero-pl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero-pl-amount{font-family:"Inter",sans-serif;font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.hero-divider{height:1px;background:var(--border);margin:18px 0 16px}
.hero-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.quick-row:last-child{border-bottom:none}

.quick-name .swatch-q{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.quick-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick-val{font-family:"Inter",sans-serif;font-size:13px;font-weight:700;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.quick-pct{font-family:"Inter",sans-serif;font-size:12px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.quick-pct .qp-sub{display:block;font-size:9px;font-weight:600;color:var(--text-3);margin-top:2px;letter-spacing:.02em}
.quick-pct.up{color:var(--up)}
.quick-pct.down{color:var(--down)}
.legend{flex:1;display:flex;flex-direction:column;gap:2px}
.legend-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-2)}
.legend-row:last-child{border-bottom:none}
.legend-name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text)}
.swatch{width:8px;height:8px;border-radius:2px}
.legend-pct{font-family:"Inter",sans-serif;font-size:12px;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums}
.tf-row{display:flex;gap:4px;background:var(--card-soft);padding:3px;border-radius:10px}
.tf-btn{flex:1;padding:6px 0;background:none;border:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--text-2);border-radius:7px;cursor:pointer;transition:all .18s;letter-spacing:.04em}
.tf-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(42,32,26,.08)}
.chart-legend{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.cl-item{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text-2)}
.cl-line{width:14px;height:2px;border-radius:1px}
.cl-value{font-family:"Inter",sans-serif;font-weight:700;color:var(--text)}
.chart-canvas{height:200px;position:relative}
.group{background:var(--card);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(42,32,26,.08),0 8px 24px rgba(42,32,26,.04);position:relative;overflow:hidden}
.group::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--group-color)}
.group-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.group-tag{display:inline-flex;align-items:center;gap:6px;background:var(--group-soft);color:var(--group-color);padding:5px 10px;border-radius:100px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.group-title{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.group-subtitle{font-size:12px;color:var(--text-2);font-weight:500;margin-top:2px}
.group-value{font-family:"Inter",sans-serif;font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--text);font-feature-settings:"tnum";text-align:right}
.group-value .cents{font-size:.55em;color:var(--text-3)}
.group-pct-row{text-align:right;margin-top:4px}
.group-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px;background:var(--card-soft);border-radius:14px;margin-bottom:12px}
.stat{display:flex;flex-direction:column;gap:3px}
.stat-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.stat-val{font-family:"Inter",sans-serif;font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.stat-val.up{color:var(--up)}
.stat-val.down{color:var(--down)}
.stat-sub{font-size:11px;color:var(--text-2);font-weight:500}
.holdings{display:flex;flex-direction:column;gap:8px}
.hcard{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card-soft);border-radius:12px}
.hcard-left{display:flex;flex-direction:column;gap:2px;min-width:0}
.hcard-ticker{font-family:"Inter",sans-serif;font-size:13px;font-weight:800;letter-spacing:.01em;color:var(--text)}
.hcard-name{font-size:11px;color:var(--text-2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.hcard-right{text-align:right;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.hcard-val{font-family:"Inter",sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.hcard-pct{font-family:"Inter",sans-serif;font-size:11px;font-weight:700}
footer{text-align:center;font-size:11px;color:rgba(255,255,255,.6);font-weight:500;margin-top:24px;letter-spacing:.05em}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="greeting"><span>Good day,</span><strong>Fernando</strong></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>
        </svg>
      </button>
      <div class="live-badge"><span class="live-dot" id="liveDot"></span><span id="live-time">—</span></div>
    </div>
  </div>

  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <div class="label">Loading portfolio data…</div>
  </div>

  <div id="errorState" class="hidden"></div>

  <div id="content" class="hidden">

    <div class="card hero">
      <div class="hero-label">Total Portfolio Value</div>
      <div class="hero-value" id="totalValue"></div>
      <div class="hero-brl" id="totalValueBRL"></div>
      <div class="hero-pl-label">All-time gain</div>
      <div class="hero-pl-row">
        <span class="pill" id="pillAll"></span>
        <span class="hero-pl-amount" id="amtAll"></span>
      </div>
      <div class="hero-divider"></div>
      <div class="hero-meta">
        <div class="meta-item"><span class="meta-label">Year-End 2025</span><span class="meta-value" id="ytdEnd2025"></span></div>
        <div class="meta-item"><span class="meta-label">YTD Return</span><span class="meta-value" id="ytdChange"></span></div>
      </div>
    </div>

    <div class="card quick">
      <div class="card-head"><span class="card-title">Quick Overview</span><span class="card-action">YTD = price return</span></div>
      <div class="quick-grid-head">
        <div>Asset</div>
        <div class="qh-r">Value</div>
        <div class="qh-r">All-time</div>
        <div class="qh-r">YTD</div>
      </div>
      <div id="quickList"></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">Allocation</span><span class="card-action" id="allocAsOf"></span></div>
      <div class="donut-wrap">
        <div class="donut-canvas">
          <canvas id="donut" width="110" height="110"></canvas>
        </div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">Portfolio Value</span></div>
      <div class="chart-legend">
        <div class="cl-item"><span class="cl-line" style="background:var(--coral)"></span><span id="cl-port-label">Now</span><span class="cl-value" id="cl-port-val">$0</span></div>
        <div class="cl-item"><span style="font-weight:600">Change</span><span class="cl-value" id="cl-port-change">$0</span></div>
      </div>
      <div class="chart-canvas"><canvas id="perfChart"></canvas></div>
      <div class="tf-row" style="margin-top:14px" id="timeframe">
        <button class="tf-btn" data-tf="6M">6M</button>
        <button class="tf-btn active" data-tf="YTD">YTD</button>
        <button class="tf-btn" data-tf="1Y">1Y</button>
        <button class="tf-btn" data-tf="2Y">2Y</button>
        <button class="tf-btn" data-tf="ALL">ALL</button>
      </div>
    </div>

    <div id="groups"></div>

    <footer>Source · INVESTIMENTS API · As of <span id="asof"></span></footer>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbzzEwjW-0GYmolO-6PCMR79HoTpMrOxGshMM7MFpA25HgP-7mHxpH9po__jsGqNhgRvLQ/exec";
const CACHE_KEY = "portfolio_raw_v2";
const CACHE_TS_KEY = "portfolio_raw_ts_v2";

// ============================================================
// PARSING UTILITIES
// ============================================================
const $ = id => document.getElementById(id);

function toNum(v) {
  if (v === null || v === undefined || v === "") return 0;
  if (typeof v === "number") return isNaN(v) ? 0 : v;
  const s = String(v).replace(/[$,R\s]/g, "").trim();
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function toDate(v, fmt = "auto") {
  if (!v && v !== 0) return null;
  if (v instanceof Date) return v;
  const s = String(v);
  // ISO 8601
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s);
  // dd/mm/yyyy or mm/dd/yyyy
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let a = +m[1], b = +m[2], y = +m[3];
    if (y < 100) y += 2000;
    if (fmt === "dmy") return new Date(y, b - 1, a);
    if (fmt === "mdy") return new Date(y, a - 1, b);
    // Auto
    if (a > 12) return new Date(y, b - 1, a);
    if (b > 12) return new Date(y, a - 1, b);
    return new Date(y, b - 1, a); // default Brazilian
  }
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function findSheet(raw, name) {
  if (raw[name]) return raw[name];
  const target = name.trim().toLowerCase();
  const k = Object.keys(raw).find(k => k.trim().toLowerCase() === target);
  return k ? raw[k] : [];
}

// Try multiple candidate sheet names (handles "_" vs " ", typos, etc.)
function findSheetAny(raw, ...names) {
  for (const n of names) {
    const r = findSheet(raw, n);
    if (r.length) return r;
  }
  return [];
}

// Tolerant column lookup: handles trailing/leading whitespace + case
function getCol(row, name) {
  if (row[name] !== undefined) return row[name];
  const target = name.trim().toLowerCase();
  const k = Object.keys(row).find(k => k.trim().toLowerCase() === target);
  return k !== undefined ? row[k] : undefined;
}

function isoMonth(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

// ============================================================
// COMPUTE: raw sheets → dashboard schema
// ============================================================
function compute(raw) {
  if (!raw || typeof raw !== "object") {
    throw new Error("API response is not an object. Got: " + typeof raw);
  }
  const sheets = Object.keys(raw);
  if (!sheets.length) throw new Error("API response has no sheets.");

  // ---- Real-time prices ----
  const rt = findSheet(raw, "REAL TIME PRICE");
  const prices = {};
  rt.forEach(r => {
    const t = r.TICKER || r.Ticker || r.ticker;
    if (t) prices[t] = toNum(r.PRICE || r.Price || r.price);
  });
  // BTC/ETH swap fix: BTC must be > ETH
  if (prices.BTC && prices.ETH && prices.BTC < prices.ETH) {
    const tmp = prices.BTC; prices.BTC = prices.ETH; prices.ETH = tmp;
  }
  const usdBrl = prices.BRL || 0.20;

  // ---- Simple BUY/SELL aggregator ----
  function aggSimple(rows) {
    let qty = 0, cost = 0;
    rows.forEach(r => {
      // Skip malformed rows where QTD doesn't parse
      const rawQ = r.QTD;
      if (typeof rawQ === "string" && !/^[\d.,]+$/.test(rawQ.replace(/\s/g, ""))) return;
      const q = toNum(rawQ);
      if (!q || q <= 0) return;
      const p = toNum(r.Price);
      const total = toNum(r.Total) || q * p;
      const t = String(r.Type || "").toUpperCase().trim();
      if (t === "BUY") { qty += q; cost += total; }
      else if (t === "SELL") {
        const avg = qty > 0 ? cost / qty : p;
        cost -= q * avg;
        qty -= q;
      }
    });
    return { qty, cost };
  }

  const qqqA = aggSimple(findSheet(raw, "QQQ"));
  const schdA = aggSimple(findSheet(raw, "SCHD"));
  const taxmA = aggSimple(findSheet(raw, "TAXM"));
  const bilA = aggSimple(findSheet(raw, "BIL"));
  const lftbA = aggSimple(findSheet(raw, "LFTB11")); // BRL

  // ---- BTC / ETH (sum QTD * TOTAL USD) ----
  function aggCrypto(rows) {
    let qty = 0, cost = 0;
    rows.forEach(r => {
      const q = toNum(r.QTD || r.Qtd || r.qtd);
      // "TOTAL USD" or similar variants
      const tk = Object.keys(r).find(k => /total\s*usd/i.test(k));
      const total = tk ? toNum(r[tk]) : 0;
      if (q > 0) { qty += q; cost += total; }
    });
    return { qty, cost };
  }
  const btcA = aggCrypto(findSheet(raw, "BTC"));
  const ethA = aggCrypto(findSheet(raw, "ETH"));

  // ---- 401k Fernando (VFIFX) ----
  const vfRows = findSheet(raw, "401K Fernando");
  let vfQty = 0, vfCost = 0, vfContrib = 0;
  vfRows.forEach(r => {
    const q = toNum(r.Quantity);
    const p = toNum(r.Price);
    const a = toNum(r.Amount);
    const t = String(r.Type || "").trim();
    if (t === "Fee") { vfQty -= q; }
    else if (/Plan Contribution/i.test(t)) { vfQty += q; vfCost += q * p; vfContrib += a; }
    else if (/Dividend|Earning|Misc/i.test(t)) { vfQty += q; vfCost += q * p; }
  });

  // ---- 401k Bruna (TRRNX trust class) ----
  const brRows = findSheet(raw, "401k Bruna");
  let trQty = 0, trCost = 0, trContrib = 0;
  let trLatestPrice = 0, trLatestDate = null;
  brRows.forEach(r => {
    const q = toNum(r.Shares);
    const p = toNum(r.Price);
    const a = toNum(r.Amount);
    const t = String(r["Activity Type"] || "").trim();
    const d = toDate(r.Date, "mdy");
    if (t === "Fee") trQty -= q;
    else if (t === "Market Fluctuation") { /* ignore qty */ }
    else if (/Contribution/i.test(t)) { trQty += q; trCost += q * p; trContrib += a; }
    else if (/Misc|Dividend|Earning/i.test(t)) { trQty += q; trCost += q * p; }
    if (p > 0 && (!trLatestDate || (d && d > trLatestDate))) {
      trLatestPrice = p; trLatestDate = d;
    }
  });
  // TRRNX current price. The sheet's REAL TIME PRICE now tracks the same (trust) share class
  // as the plan transactions, so prefer the live quote and only fall back to the latest
  // transaction price when the live one is missing or wildly off (old public-fund mismatch).
  let trrnxPrice = prices.TRRNX || trLatestPrice || 0;
  if (trLatestPrice > 0 && (!trrnxPrice || Math.abs(trrnxPrice - trLatestPrice) / trLatestPrice > 0.25)) {
    trrnxPrice = trLatestPrice;
  }

  // ---- LFTB11 (USD-priced; sheet now tracks LFTB11 in USD end-to-end) ----
  const lftbPrice = prices.LFTB11 || 0;

  // ---- REAL ESTATE (single property, illiquid, leveraged) ----
  // Sheet columns (as of 2026-09): zpid | Purchase Date | Purchase Price | Closing Cost |
  //   Down Payment | Remodeling Cost | Original Loan | Interest Rate | Current Market Price | Loan Term
  // Value = Current Market Price − mortgage balance → Fernando's equity in the house.
  // The sheet no longer carries "Mortgage Principal Paid", so the balance is amortized from
  // Original Loan / Interest Rate / Loan Term (standard fixed-rate schedule, first payment on
  // the 1st of the second month after closing).
  // Cash invested = Down Payment + Closing Cost + Remodeling (cash actually deployed).
  // All-in cost = Purchase Price + Closing + Remodeling (what the house has to be worth to break even).

  // Fixed-rate amortization: returns payment, balance and principal/interest paid to date.
  function amortize(loan, annualRatePct, termMonths, paymentsMade) {
    const r = (annualRatePct / 100) / 12;
    const n = termMonths;
    if (!(loan > 0) || !(n > 0)) return { payment: 0, balance: Math.max(0, loan), principal_paid: 0, interest_paid: 0, payments_made: 0 };
    const k = paymentsMade > 0 ? Math.min(paymentsMade, n) : 0;
    if (r === 0) {
      const pay = loan / n;
      return { payment: pay, balance: Math.max(0, loan - pay * k), principal_paid: pay * k, interest_paid: 0, payments_made: k };
    }
    const pow = Math.pow(1 + r, n);
    const payment = loan * r * pow / (pow - 1);
    // Standard closed form: B_k = L(1+r)^k − P[((1+r)^k − 1)/r]
    const powK = Math.pow(1 + r, k);
    const balance = Math.max(0, loan * powK - payment * ((powK - 1) / r));
    const principalPaid = loan - balance;
    const interestPaid = payment * k - principalPaid;
    return { payment, balance, principal_paid: principalPaid, interest_paid: Math.max(0, interestPaid), payments_made: k };
  }
  // "30 Years" / "30" / "360 months" / 30 → months
  function parseTermMonths(v) {
    if (v === null || v === undefined || v === "") return 360;
    if (typeof v === "number") return v > 60 ? Math.round(v) : Math.round(v * 12);
    const s = String(v).toLowerCase();
    const n = parseFloat(s.replace(/[^\d.]/g, ""));
    if (!n || isNaN(n)) return 360;
    if (/month|mo\b/.test(s)) return Math.round(n);
    if (/year|yr|ano/.test(s)) return Math.round(n * 12);
    return n > 60 ? Math.round(n) : Math.round(n * 12);
  }
  // Payments elapsed between closing and a given date (first payment = 1st of the 2nd month after closing).
  function paymentsElapsed(purchaseDate, asOf) {
    if (!purchaseDate || !asOf) return 0;
    const first = new Date(purchaseDate.getFullYear(), purchaseDate.getMonth() + 2, 1);
    if (asOf < first) return 0;
    return (asOf.getFullYear() - first.getFullYear()) * 12 + (asOf.getMonth() - first.getMonth()) + 1;
  }

  const reRows = findSheetAny(raw, "REAL_ESTATE", "REAL ESTATE", "REAL_STATE", "REAL STATE");
  let realEstate = null;
  if (reRows.length) {
    const r = reRows[0];
    const purchasePrice    = toNum(getCol(r, "Purchase Price"));
    const downPayment      = toNum(getCol(r, "Down Payment"));
    const closingCost      = toNum(getCol(r, "Closing Cost"));
    const remodelingCost   = toNum(getCol(r, "Remodeling Cost"));
    const originalLoan     = toNum(getCol(r, "Original Loan"));
    const interestRate     = toNum(getCol(r, "Interest Rate"));
    const termMonths       = parseTermMonths(getCol(r, "Loan Term"));
    // "Current Market Price" replaced the old Zestimate columns; keep the fallbacks for safety.
    const marketValue      = toNum(getCol(r, "Current Market Price")) || toNum(getCol(r, "Zestimate Real Time"));
    const purchaseDate     = toDate(getCol(r, "Purchase Date"), "dmy");
    const zpid             = String(getCol(r, "zpid") || "");

    const nowD  = new Date();
    const amort = amortize(originalLoan, interestRate, termMonths, paymentsElapsed(purchaseDate, nowD));

    const cashInvested    = downPayment + closingCost + remodelingCost;
    const allInCost       = purchasePrice + closingCost + remodelingCost;
    const mortgageBalance = amort.balance;
    const equity          = marketValue - mortgageBalance;
    const gainVsCash      = equity - cashInvested;
    const gainPctVsCash   = cashInvested > 0 ? (gainVsCash / cashInvested) * 100 : 0;
    const appreciation    = marketValue - purchasePrice;
    const appreciationPct = purchasePrice > 0 ? (appreciation / purchasePrice) * 100 : 0;
    const vsAllIn         = marketValue - allInCost;
    const ltv             = marketValue > 0 ? (mortgageBalance / marketValue) * 100 : 0;

    realEstate = {
      zpid,
      purchase_date: purchaseDate ? purchaseDate.toISOString().slice(0, 10) : null,
      purchase_price: +purchasePrice.toFixed(2),
      down_payment: +downPayment.toFixed(2),
      closing_cost: +closingCost.toFixed(2),
      remodeling_cost: +remodelingCost.toFixed(2),
      original_loan: +originalLoan.toFixed(2),
      interest_rate: interestRate,
      term_months: termMonths,
      term_label: termMonths % 12 === 0 ? (termMonths / 12) + "-yr" : termMonths + "mo",
      monthly_payment: +amort.payment.toFixed(2),
      payments_made: amort.payments_made,
      principal_paid: +amort.principal_paid.toFixed(2),
      interest_paid: +amort.interest_paid.toFixed(2),
      market_value: +marketValue.toFixed(2),
      cash_invested: +cashInvested.toFixed(2),
      all_in_cost: +allInCost.toFixed(2),
      vs_all_in: +vsAllIn.toFixed(2),
      ltv_pct: +ltv.toFixed(1),
      mortgage_balance: +mortgageBalance.toFixed(2),
      equity: +equity.toFixed(2),
      gain_vs_cash: +gainVsCash.toFixed(2),
      gain_pct_vs_cash: +gainPctVsCash.toFixed(2),
      appreciation: +appreciation.toFixed(2),
      appreciation_pct: +appreciationPct.toFixed(2)
    };
    // Equity as of an arbitrary past date: market value interpolated purchase → today,
    // mortgage balance from the real amortization schedule. Used by the history chart.
    realEstate._equityAt = function (d) {
      if (!purchaseDate || !d || d < purchaseDate) return 0;
      const span = nowD - purchaseDate;
      const t = span > 0 ? Math.min(1, Math.max(0, (d - purchaseDate) / span)) : 1;
      const mv = purchasePrice + (marketValue - purchasePrice) * t;
      const bal = amortize(originalLoan, interestRate, termMonths, paymentsElapsed(purchaseDate, d)).balance;
      return mv - bal;
    };
  }

  // ---- Build positions ----
  const positions = {
    QQQ: {
      name: "Invesco QQQ Trust",
      qty: qqqA.qty,
      price: prices.QQQ || 0,
      value: qqqA.qty * (prices.QQQ || 0),
      cost: qqqA.cost,
      avg_cost: qqqA.qty > 0 ? qqqA.cost / qqqA.qty : 0,
    },
    SCHD: {
      name: "Schwab US Dividend",
      qty: schdA.qty,
      price: prices.SCHD || 0,
      value: schdA.qty * (prices.SCHD || 0),
      cost: schdA.cost,
      avg_cost: schdA.qty > 0 ? schdA.cost / schdA.qty : 0,
    },
    TAXM: {
      name: "BondBloxx Tax-Aware MA",
      qty: taxmA.qty,
      price: prices.TAXM || 0,
      value: taxmA.qty * (prices.TAXM || 0),
      cost: taxmA.cost,
      avg_cost: taxmA.qty > 0 ? taxmA.cost / taxmA.qty : 0,
    },
    LFTB11: {
      name: "Tesouro Selic ETF (USD)",
      qty: lftbA.qty,
      price: lftbPrice,
      value: lftbA.qty * lftbPrice,
      cost: lftbA.cost,
      avg_cost: lftbA.qty > 0 ? lftbA.cost / lftbA.qty : 0,
    },
    BTC: {
      name: "Bitcoin",
      qty: btcA.qty,
      price: prices.BTC || 0,
      value: btcA.qty * (prices.BTC || 0),
      cost: btcA.cost,
      avg_cost: btcA.qty > 0 ? btcA.cost / btcA.qty : 0,
    },
    ETH: {
      name: "Ethereum",
      qty: ethA.qty,
      price: prices.ETH || 0,
      value: ethA.qty * (prices.ETH || 0),
      cost: ethA.cost,
      avg_cost: ethA.qty > 0 ? ethA.cost / ethA.qty : 0,
    },
    VFIFX: {
      name: "Vanguard Target 2050 (Fernando)",
      qty: vfQty,
      price: prices.VFIFX || 0,
      value: vfQty * (prices.VFIFX || 0),
      cost: vfCost,
      contribution: vfContrib,
      avg_cost: vfQty > 0 ? vfCost / vfQty : 0,
    },
    TRRNX: {
      name: "T. Rowe Price 2055 (Wife)",
      qty: trQty,
      price: trrnxPrice,
      value: trQty * trrnxPrice,
      cost: trCost,
      contribution: trContrib,
      avg_cost: trQty > 0 ? trCost / trQty : 0,
    }
  };

  // Compute pl + pl_pct for each
  Object.values(positions).forEach(p => {
    p.pl = p.value - p.cost;
    p.pl_pct = p.cost > 0 ? (p.pl / p.cost) * 100 : 0;
  });

  // Round all to sensible decimals
  Object.values(positions).forEach(p => {
    p.qty = +p.qty.toFixed(6);
    p.value = +p.value.toFixed(2);
    p.cost = +p.cost.toFixed(2);
    p.pl = +p.pl.toFixed(2);
    p.pl_pct = +p.pl_pct.toFixed(2);
    p.avg_cost = +p.avg_cost.toFixed(2);
  });

  // ---- Aggregates ----
  let total_value = Object.values(positions).reduce((s, p) => s + p.value, 0);
  let total_cost  = Object.values(positions).reduce((s, p) => s + p.cost, 0);
  if (realEstate) {
    total_value += realEstate.equity;
    total_cost  += realEstate.cash_invested;
  }

  // BTC and ETH are tracked as their own asset classes (split out 2026-09).
  const allocation = {
    QQQ: positions.QQQ.value,
    SCHD: positions.SCHD.value,
    BTC: positions.BTC.value,
    ETH: positions.ETH.value,
    Cash: positions.TAXM.value + positions.LFTB11.value,
    "401(k)": positions.VFIFX.value + positions.TRRNX.value,
  };
  if (realEstate) allocation["Real Estate"] = realEstate.equity;

  // ---- HISTORICAL PORTFOLIO VALUE ----
  // Walk HISTORIC PRICES tab; for each month with data, compute shares-held + value.
  const histRows = findSheet(raw, "HISTORIC PRICES").map(r => {
    // Tolerant column lookup (handles trailing whitespace in headers like "SP500TR  ")
    return {
      date: toDate(getCol(r, "DATE") || getCol(r, "Date"), "mdy"),
      brl: toNum(getCol(r, "BRL")),
      taxm: toNum(getCol(r, "TAXM")),
      bil: toNum(getCol(r, "BIL")),
      qqq: toNum(getCol(r, "QQQ")),
      schd: toNum(getCol(r, "SCHD")),
      btc: toNum(getCol(r, "BTC")),
      eth: toNum(getCol(r, "ETH")),
      vfifx: toNum(getCol(r, "VFIFX")),
      trrnx: toNum(getCol(r, "TRRNX")),
      lftb11: toNum(getCol(r, "LFTB11")),
      sp500tr: toNum(getCol(r, "SP500TR"))
    };
  }).filter(r => r.date && (r.qqq > 0 || r.schd > 0));

  // Pre-compute shares as-of for each ticker
  const qqqTx = findSheet(raw, "QQQ").map(r => ({ d: toDate(r.Date, "dmy"), q: toNum(r.QTD), t: String(r.Type || "").toUpperCase() })).filter(r => r.d && r.q);
  const schdTx = findSheet(raw, "SCHD").map(r => ({ d: toDate(r.Date, "dmy"), q: toNum(r.QTD), t: String(r.Type || "").toUpperCase() })).filter(r => r.d && r.q);
  const taxmTx = findSheet(raw, "TAXM").map(r => ({ d: toDate(r.Date, "dmy"), q: toNum(r.QTD), t: String(r.Type || "").toUpperCase() })).filter(r => r.d && r.q);
  const bilTx = findSheet(raw, "BIL").map(r => ({ d: toDate(r.Date, "dmy"), q: toNum(r.QTD), t: String(r.Type || "").toUpperCase() })).filter(r => r.d && r.q);
  const lftbTx = findSheet(raw, "LFTB11").map(r => ({ d: toDate(r.Date, "dmy"), q: toNum(r.QTD), t: String(r.Type || "").toUpperCase() })).filter(r => r.d && r.q);
  const btcTx = findSheet(raw, "BTC").map(r => ({ d: toDate(r["Date USA"] || r.Date, "mdy"), q: toNum(r.QTD) })).filter(r => r.d && r.q);
  const ethTx = findSheet(raw, "ETH").map(r => ({ d: toDate(r["Date USA"] || r.Date, "mdy"), q: toNum(r.QTD) })).filter(r => r.d && r.q);
  const vfTx = vfRows.map(r => ({
    d: toDate(r.Date, "mdy"),
    q: toNum(r.Quantity),
    t: String(r.Type || "").trim()
  })).filter(r => r.d && r.q);
  const trTx = brRows.map(r => ({
    d: toDate(r.Date, "mdy"),
    q: toNum(r.Shares),
    t: String(r["Activity Type"] || "").trim()
  })).filter(r => r.d && r.q);

  function sharesAt(tx, target, kind) {
    let q = 0;
    for (const r of tx) {
      if (r.d > target) continue;
      if (kind === "buysell") {
        if (r.t === "BUY") q += r.q;
        else if (r.t === "SELL") q -= r.q;
      } else if (kind === "crypto") {
        q += r.q;
      } else if (kind === "vfifx") {
        if (r.t === "Fee") q -= r.q;
        else q += r.q;
      } else if (kind === "trrnx") {
        if (r.t === "Fee") q -= r.q;
        else if (r.t === "Market Fluctuation") {} 
        else q += r.q;
      }
    }
    return q;
  }

  // TRRNX share-class guard. The HISTORIC PRICES column now tracks the same trust class as the
  // plan transactions, so no scaling is needed. Only if the historic series is clearly a different
  // (cheaper public-fund) share class do we rescale it — detected off the latest historic close.
  const lastHistTrrnx = (() => {
    for (let i = histRows.length - 1; i >= 0; i--) if (histRows[i].trrnx > 0) return histRows[i].trrnx;
    return 0;
  })();
  const trrnxScale = (trrnxPrice && lastHistTrrnx && (trrnxPrice / lastHistTrrnx) > 1.6)
    ? trrnxPrice / lastHistTrrnx
    : 1;

  // Per-month per-group values (used for total + Quick Overview YTD)
  const historyDetailed = histRows.map(h => {
    const t = h.date;
    const qq = sharesAt(qqqTx, t, "buysell") * h.qqq;
    const sc = sharesAt(schdTx, t, "buysell") * h.schd;
    const tx = sharesAt(taxmTx, t, "buysell") * h.taxm;
    const bi = sharesAt(bilTx, t, "buysell") * h.bil;
    const lf = sharesAt(lftbTx, t, "buysell") * h.lftb11; // USD price from sheet
    const bc = sharesAt(btcTx, t, "crypto") * h.btc;
    const et = sharesAt(ethTx, t, "crypto") * h.eth;
    const vf = sharesAt(vfTx, t, "vfifx") * h.vfifx;
    const tr = sharesAt(trTx, t, "trrnx") * h.trrnx * trrnxScale;
    // Real Estate equity: market value interpolated purchase → today, mortgage from the
    // amortization schedule. 0 before closing so end-2025 baseline and earlier history stay clean.
    const re = (realEstate && realEstate._equityAt) ? realEstate._equityAt(t) : 0;
    const groups = {
      QQQ: qq,
      SCHD: sc,
      BTC: bc,
      ETH: et,
      Cash: tx + bi + lf,
      "401(k)": vf + tr,
      "Real Estate": re
    };
    return {
      date: t.toISOString().slice(0, 10),
      groups,
      value: +(qq + sc + tx + bi + lf + bc + et + vf + tr + re).toFixed(2)
    };
  }).filter(h => h.value > 0).sort((a, b) => a.date.localeCompare(b.date));

  // The HISTORIC PRICES tab only carries month-end closes, and the current month's row is empty
  // until it closes — so the series would otherwise stop weeks in the past while the hero card
  // shows today's live number. Append a live "today" point (live prices, current holdings) so the
  // chart actually ends at the value shown at the top of the dashboard.
  const todayISO = new Date().toISOString().slice(0, 10);
  const liveGroups = {
    QQQ: positions.QQQ.value,
    SCHD: positions.SCHD.value,
    BTC: positions.BTC.value,
    ETH: positions.ETH.value,
    Cash: positions.TAXM.value + positions.LFTB11.value,
    "401(k)": positions.VFIFX.value + positions.TRRNX.value,
    "Real Estate": realEstate ? realEstate.equity : 0
  };
  const liveTotal = +Object.values(liveGroups).reduce((a, b) => a + b, 0).toFixed(2);
  if (historyDetailed.length && historyDetailed[historyDetailed.length - 1].date >= todayISO) {
    historyDetailed[historyDetailed.length - 1] = { date: todayISO, groups: liveGroups, value: liveTotal, live: true };
  } else {
    historyDetailed.push({ date: todayISO, groups: liveGroups, value: liveTotal, live: true });
  }

  const history = historyDetailed.map(h => ({ date: h.date, value: h.value, live: !!h.live }));

  // End of 2025 lookup (total + per-group)
  const end_2025_detailed = historyDetailed.find(h => h.date === "2025-12-31");
  const end_2025_value = end_2025_detailed ? end_2025_detailed.value : null;
  const end_2025_by_group = end_2025_detailed ? end_2025_detailed.groups : null;

  // Price-only YTD: hold the same shares we had at 2025-12-31, mark to today's prices.
  // Strips 2026 contributions/withdrawals so per-group YTD is apples-to-apples vs the SP500TR sentinel.
  const e25 = new Date(Date.UTC(2025, 11, 31));
  const ytd_priced_by_group = {
    QQQ:      sharesAt(qqqTx,  e25, "buysell") * (prices.QQQ    || 0),
    SCHD:     sharesAt(schdTx, e25, "buysell") * (prices.SCHD   || 0),
    BTC:      sharesAt(btcTx,  e25, "crypto")  * (prices.BTC    || 0),
    ETH:      sharesAt(ethTx,  e25, "crypto")  * (prices.ETH    || 0),
    Cash:     sharesAt(taxmTx, e25, "buysell") * (prices.TAXM   || 0)
            + sharesAt(bilTx,  e25, "buysell") * (prices.BIL    || 0)
            + sharesAt(lftbTx, e25, "buysell") * (prices.LFTB11 || 0),
    "401(k)": sharesAt(vfTx,   e25, "vfifx")   * (prices.VFIFX  || 0)
            + sharesAt(trTx,   e25, "trrnx")   * (trrnxPrice    || 0)
  };
  // Real Estate didn't exist at end-2025 → 0 here keeps YTD% honest (Real Estate is excluded from YTD math).
  if (realEstate) ytd_priced_by_group["Real Estate"] = 0;
  const ytd_priced_total = Object.values(ytd_priced_by_group).reduce((a, b) => a + b, 0);

  // ---- S&P 500 series (live from HISTORIC PRICES SP500TR column) ----
  const spx = histRows.filter(h => h.sp500tr > 0).map(h => ({
    date: h.date.toISOString().slice(0, 10),
    value: h.sp500tr
  })).sort((a, b) => a.date.localeCompare(b.date));

  // ---- S&P 500 YTD % (live SP500TR vs end-2025 close) ----
  // Sanity guard: the live SP500TR cell has come back on a different scale before (it currently
  // quotes roughly half the total-return series in HISTORIC PRICES, which would print a −47% year).
  // If the live quote is more than 25% away from the last monthly close, fall back to that close.
  const sp500_end_2025 = (spx.find(p => p.date === "2025-12-31") || {}).value || 0;
  const sp500_last_close = spx.length ? spx[spx.length - 1].value : 0;
  const sp500_last_date = spx.length ? spx[spx.length - 1].date : null;
  const sp500_live = prices.SP500TR || 0;
  const sp500_live_ok = sp500_live > 0 && sp500_last_close > 0
    && Math.abs(sp500_live - sp500_last_close) / sp500_last_close <= 0.25;
  const sp500_now = sp500_live_ok ? sp500_live : sp500_last_close;
  const sp500_ytd_pct = sp500_end_2025 ? +(((sp500_now - sp500_end_2025) / sp500_end_2025) * 100).toFixed(2) : 0;
  const sp500_as_of = sp500_live_ok ? "live" : sp500_last_date;

  // ---- Final schema ----
  return {
    as_of: new Date().toISOString().slice(0, 10),
    total_value: +total_value.toFixed(2),
    total_cost: +total_cost.toFixed(2),
    unrealized_pl: +(total_value - total_cost).toFixed(2),
    unrealized_pct: total_cost > 0 ? +(((total_value - total_cost) / total_cost) * 100).toFixed(2) : 0,
    end_2025_value,
    end_2025_by_group,
    ytd_priced_by_group,
    ytd_priced_total: +ytd_priced_total.toFixed(2),
    positions,
    allocation,
    history,
    spx,
    sp500_ytd_pct,
    sp500_as_of,
    fx: { usd_brl_rate: usdBrl },
    real_estate: realEstate
  };
}

// ============================================================
// FETCH + CACHE
// ============================================================
async function fetchData() {
  const res = await fetch(API_URL, { method: "GET", redirect: "follow", cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error("Response was not valid JSON. First 300 chars: " + text.slice(0, 300)); }
  return data;
}
function loadCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch { return null; } }
function saveCache(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); localStorage.setItem(CACHE_TS_KEY, Date.now().toString()); } catch {} }
function cacheAge() { const t = +localStorage.getItem(CACHE_TS_KEY) || 0; return t ? Date.now() - t : null; }

// ============================================================
// UI HELPERS
// ============================================================
function showState(state) {
  $("loadingState").classList.toggle("hidden", state !== "loading");
  $("content").classList.toggle("hidden", state !== "ready");
  $("errorState").classList.toggle("hidden", state !== "error");
}
function setLiveStatus(kind, label) {
  const dot = $("liveDot");
  dot.className = "live-dot" + (kind === "stale" ? " stale" : kind === "error" ? " error" : "");
  $("live-time").textContent = label;
}
function showError(msg, raw) {
  $("errorState").innerHTML = `
    <div class="error-card">
      <div class="error-title">⚠ Couldn't load portfolio</div>
      <div class="error-msg">${msg}</div>
      <div class="error-actions">
        <button class="btn btn-primary" onclick="initLoad()">Retry</button>
        <a class="btn btn-secondary" href="${API_URL}" target="_blank">Open API URL</a>
      </div>
      ${raw ? `<div class="error-debug">${escapeHtml(raw).slice(0, 1500)}</div>` : ""}
    </div>`;
  showState("error");
}
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]); }

// ============================================================
// FORMATTING
// ============================================================
const fmt = (n, d = 2) => Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtK = n => { const a = Math.abs(n); if (a >= 1e6) return "$" + (n / 1e6).toFixed(2) + "M"; if (a >= 1e3) return "$" + (n / 1e3).toFixed(0) + "K"; return "$" + n.toFixed(0); };
const split = n => { const [i, d] = fmt(n).split("."); return { int: (n < 0 ? "-" : "") + i, dec: d }; };
const sgn = n => n >= 0 ? "+" : "−";
const cls = n => n >= 0 ? "up" : "down";
const arrow = n => n >= 0 ? "↑" : "↓";

const GROUPS = {
  QQQ: { color: "#E07856", soft: "#FBE4DA", title: "Growth", short: "Growth", subtitle: "QQQ — NASDAQ 100" },
  SCHD: { color: "#4D9C8C", soft: "#DCEFEB", title: "Dividends", short: "Dividends", subtitle: "SCHD — Schwab US Dividend" },
  BTC: { color: "#C49960", soft: "#F5E8D2", title: "Bitcoin", short: "Bitcoin", subtitle: "BTC" },
  ETH: { color: "#6C7BC4", soft: "#E2E5F4", title: "Ethereum", short: "Ethereum", subtitle: "ETH" },
  Cash: { color: "#7E8FA0", soft: "#E0E6EC", title: "Cash & Equivalents", short: "Cash", subtitle: "TAXM + LFTB11 (USD)" },
  "401(k)": { color: "#A87BAB", soft: "#ECE0EE", title: "401(k) Combined", short: "401(k)", subtitle: "Fernando + Wife" },
  "Real Estate": { color: "#8B6B4F", soft: "#EDE2D2", title: "Real Estate", short: "Real Estate", subtitle: "Investment Property" }
};

// ============================================================
// RENDER
// ============================================================
let perfChart = null;
function render(D) {
  const tv = split(D.total_value);
  $("totalValue").innerHTML = `$${tv.int}<span class="cents">.${tv.dec}</span>`;
  // BRL conversion (REAL TIME PRICE tab → BRL = USD per 1 BRL, e.g. 0.2016)
  const brlRate = (D.fx && D.fx.usd_brl_rate) || 0;
  if (brlRate > 0) {
    const brlValue = D.total_value / brlRate;
    $("totalValueBRL").textContent = "≈ R$ " + brlValue.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
  } else {
    $("totalValueBRL").textContent = "";
  }
  $("asof").textContent = D.as_of;
  $("allocAsOf").textContent = D.as_of;

  const end2025 = D.end_2025_value || 0;
  // YTD = price-only return (apples-to-apples with S&P 500 sentinel below).
  const ytdChg = (D.ytd_priced_total || 0) - end2025;
  const ytdPct = end2025 ? (ytdChg / end2025) * 100 : 0;

  const pillAll = $("pillAll");
  pillAll.innerHTML = `<span class="pill-arrow">${arrow(D.unrealized_pct)}</span> ${sgn(D.unrealized_pct)}${fmt(D.unrealized_pct)}%`;
  pillAll.className = "pill " + (D.unrealized_pct >= 0 ? "pill-up" : "pill-down");
  const amtAll = $("amtAll");
  amtAll.textContent = `${sgn(D.unrealized_pl)}$${fmt(Math.abs(D.unrealized_pl), 0)}`;
  amtAll.style.color = D.unrealized_pl >= 0 ? "var(--up)" : "var(--down)";
  $("ytdEnd2025").innerHTML = `$${fmt(end2025, 0)}`;
  $("ytdChange").innerHTML = `<span style="color:${ytdChg >= 0 ? 'var(--up)' : 'var(--down)'}">${sgn(ytdPct)}${fmt(ytdPct)}%</span><span class="sub">${sgn(ytdChg)}$${fmt(Math.abs(ytdChg), 0)}</span>`;

  // Quick Overview card (above Allocation, below Total)
  const qList = $("quickList");
  qList.innerHTML = "";
  const groupVals = {
    QQQ:     { value: D.allocation.QQQ,     cost: D.positions.QQQ.cost },
    SCHD:    { value: D.allocation.SCHD,    cost: D.positions.SCHD.cost },
    BTC:     { value: D.allocation.BTC,     cost: D.positions.BTC.cost },
    ETH:     { value: D.allocation.ETH,     cost: D.positions.ETH.cost },
    Cash:    { value: D.allocation.Cash,    cost: D.positions.TAXM.cost + D.positions.LFTB11.cost },
    "401(k)":{ value: D.allocation["401(k)"], cost: D.positions.VFIFX.cost + D.positions.TRRNX.cost }
  };
  if (D.real_estate) {
    groupVals["Real Estate"] = { value: D.real_estate.equity, cost: D.real_estate.cash_invested };
  }
  const QUICK_ORDER = D.real_estate
    ? ["QQQ","SCHD","BTC","ETH","Cash","401(k)","Real Estate"]
    : ["QQQ","SCHD","BTC","ETH","Cash","401(k)"];
  QUICK_ORDER.forEach(k => {
    const g = GROUPS[k]; const gv = groupVals[k];
    const allTimePl = gv.value - gv.cost;
    const allTimePct = gv.cost > 0 ? (allTimePl / gv.cost) * 100 : 0;
    const end25 = (D.end_2025_by_group && D.end_2025_by_group[k]) || 0;
    // Price-only YTD: same end-2025 shares marked to today's prices, so it compares to S&P 500 fairly.
    const ytdNow = (D.ytd_priced_by_group && D.ytd_priced_by_group[k]) || 0;
    const ytdChg = end25 ? ytdNow - end25 : 0;
    const ytdPct = end25 ? (ytdChg / end25) * 100 : 0;
    const allCls = allTimePl >= 0 ? "up" : "down";
    const ytdCls = ytdChg >= 0 ? "up" : "down";
    const allTimeStr = `${sgn(allTimePct)}${fmt(Math.abs(allTimePct), 1)}%<span class="qp-sub">${sgn(allTimePl)}${fmtK(Math.abs(allTimePl))}</span>`;
    const ytdStr = end25 ? `${sgn(ytdPct)}${fmt(Math.abs(ytdPct), 1)}%<span class="qp-sub">${sgn(ytdChg)}${fmtK(Math.abs(ytdChg))}</span>` : `<span style="color:var(--text-3)">—</span>`;
    const row = document.createElement("div");
    row.className = "quick-row";
    row.innerHTML = `
      <div class="quick-name"><span class="swatch-q" style="background:${g.color}"></span><span>${g.short || g.title}</span></div>
      <div class="quick-val">${fmtK(gv.value)}</div>
      <div class="quick-pct ${allCls}">${allTimeStr}</div>
      <div class="quick-pct ${ytdCls}">${ytdStr}</div>`;
    qList.appendChild(row);
  });
  // S&P 500 benchmark row — YTD-only reference for whether it's a good or bad year overall
  const spxYtd = D.sp500_ytd_pct || 0;
  const spxCls = spxYtd >= 0 ? "up" : "down";
  // "live" when the SP500TR quote in Real Time Price is usable; otherwise the last monthly close.
  const spxSub = (!D.sp500_as_of || D.sp500_as_of === "live")
    ? "market"
    : "thru " + new Date(D.sp500_as_of).toLocaleDateString("en-US", { month: "short", timeZone: "UTC" });
  const spxRow = document.createElement("div");
  spxRow.className = "quick-row benchmark";
  spxRow.innerHTML = `
    <div class="quick-name"><span class="swatch-q"></span><span>S&amp;P 500</span></div>
    <div class="quick-val" style="color:var(--text-3)">—</div>
    <div class="quick-pct" style="color:var(--text-3)">—</div>
    <div class="quick-pct ${spxCls}">${sgn(spxYtd)}${fmt(Math.abs(spxYtd), 1)}%<span class="qp-sub">${spxSub}</span></div>`;
  qList.appendChild(spxRow);

  // Allocation donut
  const allocSorted = Object.entries(D.allocation).map(([k, v]) => ({ label: k, value: v, color: (GROUPS[k] || { color: "#888" }).color })).sort((a, b) => b.value - a.value);
  const allocTotal = allocSorted.reduce((a, b) => a + b.value, 0);
  const dCanvas = $("donut");
  const dpr = window.devicePixelRatio || 1;
  // Set backing-store size for crisp render, then lock CSS size to 110x110
  dCanvas.width = 110 * dpr;
  dCanvas.height = 110 * dpr;
  dCanvas.style.width = "110px";
  dCanvas.style.height = "110px";
  const dctx = dCanvas.getContext("2d");
  dctx.setTransform(1, 0, 0, 1, 0, 0); // reset (in case render() ran before)
  dctx.scale(dpr, dpr);
  dctx.clearRect(0, 0, 110, 110);
  let start = -Math.PI / 2;
  allocSorted.forEach(seg => {
    const ang = (seg.value / allocTotal) * Math.PI * 2;
    dctx.beginPath();
    dctx.arc(55, 55, 50, start, start + ang);
    dctx.arc(55, 55, 36, start + ang, start, true);
    dctx.closePath(); dctx.fillStyle = seg.color; dctx.fill();
    start += ang;
  });
  const legendEl = $("legend"); legendEl.innerHTML = "";
  allocSorted.forEach(seg => {
    const pct = ((seg.value / allocTotal) * 100).toFixed(1);
    const row = document.createElement("div");
    row.className = "legend-row";
    row.innerHTML = `<span class="legend-name"><span class="swatch" style="background:${seg.color}"></span>${seg.label}</span><span class="legend-pct">${pct}%</span>`;
    legendEl.appendChild(row);
  });

  // Portfolio Value over time ($ — actual value, not rebased)
  const ctx = $("perfChart").getContext("2d");
  function tfSlice(series, tf) {
    if (tf === "YTD") {
      const idx = series.findIndex(h => h.date >= "2025-12-31");
      return idx >= 0 ? series.slice(idx) : series.slice();
    }
    let n;
    switch (tf) { case "6M": n = 6; break; case "1Y": n = 12; break; case "2Y": n = 24; break; default: n = series.length; }
    // The series ends with a live "today" point on top of the month-end closes — keep it
    // without stealing one of the N months the user asked for.
    if (series.length && series[series.length - 1].live) n += 1;
    return series.slice(-n);
  }
  function drawChart(tf) {
    const port = tfSlice(D.history, tf);
    if (!port.length) return;
    const startV = port[0].value;
    const endV = port[port.length - 1].value;
    const change = endV - startV;
    const changePct = startV ? (change / startV) * 100 : 0;
    $("cl-port-val").textContent = "$" + fmt(endV, 0);
    $("cl-port-label").textContent = "Now";
    $("cl-port-change").innerHTML = `${sgn(change)}$${fmt(Math.abs(change), 0)} <span style="opacity:.6">(${sgn(changePct)}${fmt(Math.abs(changePct), 1)}%)</span>`;
    $("cl-port-change").style.color = change >= 0 ? "var(--up)" : "var(--down)";
    const grad = ctx.createLinearGradient(0, 0, 0, 200);
    grad.addColorStop(0, "rgba(224,120,86,0.22)");
    grad.addColorStop(1, "rgba(224,120,86,0)");
    if (perfChart) perfChart.destroy();
    perfChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: port.map(p => p.date),
        datasets: [
          { label: "Portfolio Value", data: port.map(p => p.value), borderColor: "#E07856", borderWidth: 2.2, backgroundColor: grad, fill: true, tension: 0.35,
            pointRadius: port.map((p, i) => (p.live && i === port.length - 1) ? 3.5 : 0),
            pointBackgroundColor: "#E07856", pointBorderColor: "#fff", pointBorderWidth: 2,
            pointHoverRadius: 5, pointHoverBackgroundColor: "#E07856", pointHoverBorderColor: "#fff", pointHoverBorderWidth: 2 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 500, easing: "easeOutCubic" },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: "#FFFFFF", titleColor: "#A89A8E", bodyColor: "#2A201A",
            borderColor: "rgba(42,32,26,.08)", borderWidth: 1, padding: 10,
            titleFont: { family: "Inter", size: 11, weight: 600 },
            bodyFont: { family: "Inter", size: 12, weight: 700 },
            displayColors: false,
            callbacks: { title: i => i[0].label, label: c => " $" + c.parsed.y.toLocaleString("en-US", { maximumFractionDigits: 0 }) }
          }
        },
        scales: {
          x: { grid: { display: false }, border: { display: false }, ticks: { color: "#A89A8E", font: { family: "Inter", size: 10, weight: 500 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 5,
            callback: function (v) { const l = this.getLabelForValue(v); const [y, m] = l.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][parseInt(m)-1] + " " + y.slice(2); } } },
          y: { grid: { color: "rgba(42,32,26,.05)", drawTicks: false }, border: { display: false }, ticks: { color: "#A89A8E", font: { family: "Inter", size: 10, weight: 500 }, padding: 6, callback: v => v >= 1000 ? "$" + (v / 1000).toFixed(0) + "K" : "$" + v } }
        },
        interaction: { intersect: false, mode: "index" }
      }
    });
  }
  drawChart("YTD");
  $("timeframe").onclick = e => {
    const btn = e.target.closest(".tf-btn"); if (!btn) return;
    $("timeframe").querySelectorAll(".tf-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    drawChart(btn.dataset.tf);
  };

  // Group cards
  function pctOf(v) { return ((v / D.total_value) * 100).toFixed(1) + "%"; }
  function holdingItem(tk, p, opts = {}) {
    const valStr = "$" + fmt(p.value, 0);
    const pctStr = (p.pl_pct !== undefined) ? `<span class="hcard-pct" style="color:${p.pl_pct >= 0 ? 'var(--up)' : 'var(--down)'}">${sgn(p.pl_pct)}${fmt(p.pl_pct)}%</span>` : "";
    const subline = opts.subline || `${fmt(p.qty, p.qty < 1 ? 4 : 0)} sh · avg $${fmt(p.avg_cost || p.price)}`;
    return `<div class="hcard"><div class="hcard-left"><span class="hcard-ticker">${tk}</span><span class="hcard-name">${subline}</span></div><div class="hcard-right"><span class="hcard-val">${valStr}</span>${pctStr}</div></div>`;
  }
  function statBlock(label, value, sub, klass) {
    return `<div class="stat"><span class="stat-label">${label}</span><span class="stat-val ${klass||''}">${value}</span>${sub ? `<span class="stat-sub">${sub}</span>` : ''}</div>`;
  }
  function groupCard(key, blocks, holdings) {
    const g = GROUPS[key];
    return `<div class="group" style="--group-color:${g.color};--group-soft:${g.soft}">
      <div class="group-head">
        <div><div class="group-tag">${g.title}</div><div class="group-subtitle">${blocks.subtitle || g.subtitle}</div></div>
        <div><div class="group-value">${blocks.value}</div><div class="group-pct-row"><span class="pill ${blocks.pl >= 0 ? 'pill-up' : 'pill-down'}">${sgn(blocks.plPct)}${fmt(blocks.plPct)}%</span></div></div>
      </div>
      <div class="group-stats">
        ${statBlock("Cost Basis", "$" + fmt(blocks.cost, 0))}
        ${statBlock("Unrealized", `${sgn(blocks.pl)}$${fmt(Math.abs(blocks.pl), 0)}`, null, cls(blocks.pl))}
        ${statBlock("% of Portfolio", pctOf(blocks.totalValue))}
        ${blocks.extraStat || statBlock("Positions", blocks.posCount || "1")}
      </div>
      <div class="holdings">${holdings}</div>
    </div>`;
  }

  const groupsEl = $("groups"); groupsEl.innerHTML = "";
  const P = D.positions;
  // QQQ
  if (P.QQQ && P.QQQ.qty > 0) { const p = P.QQQ; const s = split(p.value);
    groupsEl.innerHTML += groupCard("QQQ", { value: `$${s.int}<span class="cents">.${s.dec}</span>`, pl: p.pl, plPct: p.pl_pct, cost: p.cost, totalValue: p.value, posCount: 1, extraStat: statBlock("Shares", fmt(p.qty, 0), "@ $" + fmt(p.avg_cost)) }, holdingItem("QQQ", p)); }
  // SCHD
  if (P.SCHD && P.SCHD.qty > 0) { const p = P.SCHD; const s = split(p.value);
    groupsEl.innerHTML += groupCard("SCHD", { value: `$${s.int}<span class="cents">.${s.dec}</span>`, pl: p.pl, plPct: p.pl_pct, cost: p.cost, totalValue: p.value, posCount: 1, extraStat: statBlock("Shares", fmt(p.qty, 0), "@ $" + fmt(p.avg_cost)) }, holdingItem("SCHD", p)); }
  // Bitcoin
  if (P.BTC && P.BTC.qty > 0) {
    const b = P.BTC; const s = split(b.value);
    const ytdNow = (D.ytd_priced_by_group && D.ytd_priced_by_group.BTC) || 0;
    const end25 = (D.end_2025_by_group && D.end_2025_by_group.BTC) || 0;
    const ytdPctB = end25 ? ((ytdNow - end25) / end25) * 100 : null;
    groupsEl.innerHTML += groupCard("BTC", {
      value: `$${s.int}<span class="cents">.${s.dec}</span>`, pl: b.pl, plPct: b.pl_pct, cost: b.cost, totalValue: b.value, posCount: 1,
      subtitle: `BTC · $${fmt(b.price, 0)} now`,
      extraStat: ytdPctB === null
        ? statBlock("Price", "$" + fmt(b.price, 0), "live")
        : statBlock("YTD (price)", `${sgn(ytdPctB)}${fmt(Math.abs(ytdPctB), 1)}%`, "same coins since Dec 31", cls(ytdPctB))
    }, holdingItem("BTC", b, { subline: `${fmt(b.qty, 4)} BTC · avg $${fmt(b.avg_cost, 0)}` }));
  }
  // Ethereum
  if (P.ETH && P.ETH.qty > 0) {
    const e = P.ETH; const s = split(e.value);
    const ytdNow = (D.ytd_priced_by_group && D.ytd_priced_by_group.ETH) || 0;
    const end25 = (D.end_2025_by_group && D.end_2025_by_group.ETH) || 0;
    const ytdPctE = end25 ? ((ytdNow - end25) / end25) * 100 : null;
    groupsEl.innerHTML += groupCard("ETH", {
      value: `$${s.int}<span class="cents">.${s.dec}</span>`, pl: e.pl, plPct: e.pl_pct, cost: e.cost, totalValue: e.value, posCount: 1,
      subtitle: `ETH · $${fmt(e.price, 0)} now`,
      extraStat: ytdPctE === null
        ? statBlock("Price", "$" + fmt(e.price, 0), "live")
        : statBlock("YTD (price)", `${sgn(ytdPctE)}${fmt(Math.abs(ytdPctE), 1)}%`, "same coins since Dec 31", cls(ytdPctE))
    }, holdingItem("ETH", e, { subline: `${fmt(e.qty, 3)} ETH · avg $${fmt(e.avg_cost, 0)}` }));
  }
  // Cash
  if (P.TAXM && P.LFTB11) {
    const t = P.TAXM, l = P.LFTB11; const total = t.value + l.value, cost = t.cost + l.cost, pl = total - cost, plPct = cost ? (pl / cost) * 100 : 0; const s = split(total);
    groupsEl.innerHTML += groupCard("Cash", { value: `$${s.int}<span class="cents">.${s.dec}</span>`, pl, plPct, cost, totalValue: total, posCount: 2, extraStat: statBlock("Positions", "2", "TAXM + LFTB11") }, holdingItem("TAXM", t, { subline: `${fmt(t.qty, 0)} sh · @ $${fmt(t.avg_cost)}` }) + holdingItem("LFTB11", l, { subline: `${fmt(l.qty, 0)} sh · @ $${fmt(l.avg_cost)}` }));
  }
  // 401(k)
  if (P.VFIFX && P.TRRNX) {
    const v = P.VFIFX, w = P.TRRNX; const total = v.value + w.value, cost = v.cost + w.cost, contrib = (v.contribution || 0) + (w.contribution || 0), pl = total - cost, plPct = cost ? (pl / cost) * 100 : 0; const s = split(total);
    groupsEl.innerHTML += groupCard("401(k)", { value: `$${s.int}<span class="cents">.${s.dec}</span>`, pl, plPct, cost, totalValue: total, posCount: 2, extraStat: statBlock("Contributions", "$" + fmt(contrib, 0), "Total deposited") }, holdingItem("VFIFX", v, { subline: `Fernando · ${fmt(v.qty, 0)} sh` }) + holdingItem("TRRNX", w, { subline: `Wife · ${fmt(w.qty, 0)} sh` }));
  }

  // Real Estate (custom card — no shares/holdings, leveraged + illiquid)
  if (D.real_estate) {
    const re = D.real_estate;
    const g = GROUPS["Real Estate"];
    const eq = split(re.equity);
    const eqHtml = `$${eq.int}<span class="cents">.${eq.dec}</span>`;
    const gainCls = re.gain_vs_cash >= 0 ? "up" : "down";
    const apprCls = re.appreciation >= 0 ? "up" : "down";
    const apprColor = re.appreciation >= 0 ? "var(--up)" : "var(--down)";
    const allInCls = re.vs_all_in >= 0 ? "up" : "down";
    const allInColor = re.vs_all_in >= 0 ? "var(--up)" : "var(--down)";
    const purchaseLabel = re.purchase_date
      ? new Date(re.purchase_date).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric", timeZone: "UTC" })
      : "—";
    const rateStr = fmt(re.interest_rate, 3).replace(/0+$/, "").replace(/\.$/, "");
    groupsEl.innerHTML += `<div class="group" style="--group-color:${g.color};--group-soft:${g.soft}">
      <div class="group-head">
        <div><div class="group-tag">${g.title}</div><div class="group-subtitle">Equity · bought ${purchaseLabel}</div></div>
        <div>
          <div class="group-value">${eqHtml}</div>
          <div class="group-pct-row"><span class="pill ${re.gain_vs_cash >= 0 ? 'pill-up' : 'pill-down'}">${sgn(re.gain_pct_vs_cash)}${fmt(Math.abs(re.gain_pct_vs_cash), 1)}%</span></div>
        </div>
      </div>
      <div class="group-stats">
        ${statBlock("Market Value", "$" + fmt(re.market_value, 0), `${sgn(re.appreciation)}$${fmt(Math.abs(re.appreciation), 0)} vs purchase`, apprCls)}
        ${statBlock("Cash Invested", "$" + fmt(re.cash_invested, 0), "DP · closing · remodel")}
        ${statBlock("Mortgage", "$" + fmt(re.mortgage_balance, 0), `${fmt(re.ltv_pct, 1)}% LTV`)}
        ${statBlock("% of Portfolio", pctOf(re.equity))}
      </div>
      <div class="holdings">
        <div class="hcard">
          <div class="hcard-left"><span class="hcard-ticker">Equity Build</span><span class="hcard-name">Down payment + principal + appreciation</span></div>
          <div class="hcard-right"><span class="hcard-val">$${fmt(re.equity, 0)}</span><span class="hcard-pct" style="color:${apprColor}">${sgn(re.appreciation)}$${fmt(Math.abs(re.appreciation), 0)} appr.</span></div>
        </div>
        <div class="hcard">
          <div class="hcard-left"><span class="hcard-ticker">All-in Cost</span><span class="hcard-name">Purchase $${fmt(re.purchase_price, 0)} + closing + remodel</span></div>
          <div class="hcard-right"><span class="hcard-val">$${fmt(re.all_in_cost, 0)}</span><span class="hcard-pct" style="color:${allInColor}">${sgn(re.vs_all_in)}$${fmt(Math.abs(re.vs_all_in), 0)} vs market</span></div>
        </div>
        <div class="hcard">
          <div class="hcard-left"><span class="hcard-ticker">Down Payment</span><span class="hcard-name">Closing $${fmt(re.closing_cost, 0)} · remodel $${fmt(re.remodeling_cost, 0)}</span></div>
          <div class="hcard-right"><span class="hcard-val">$${fmt(re.down_payment, 0)}</span></div>
        </div>
        <div class="hcard">
          <div class="hcard-left"><span class="hcard-ticker">Loan</span><span class="hcard-name">${rateStr}% · ${re.term_label} · $${fmt(re.monthly_payment, 0)}/mo P&amp;I</span></div>
          <div class="hcard-right"><span class="hcard-val">$${fmt(re.original_loan, 0)}</span><span class="hcard-pct" style="color:var(--text-3)">originated</span></div>
        </div>
        <div class="hcard">
          <div class="hcard-left"><span class="hcard-ticker">Paid Down</span><span class="hcard-name">${re.payments_made} payment${re.payments_made === 1 ? "" : "s"} · $${fmt(re.interest_paid, 0)} interest</span></div>
          <div class="hcard-right"><span class="hcard-val">$${fmt(re.principal_paid, 0)}</span><span class="hcard-pct" style="color:var(--text-3)">principal</span></div>
        </div>
      </div>
    </div>`;
  }

}

// ============================================================
// LOAD
// ============================================================
async function initLoad() {
  setLiveStatus("normal", "Loading…");

  const cached = loadCache();
  if (cached) {
    try {
      const D = compute(cached);
      render(D);
      showState("ready");
      const age = cacheAge();
      const min = age != null ? Math.round(age / 60000) : null;
      setLiveStatus(min != null && min > 60 ? "stale" : "normal", min == null ? "Cached" : (min < 1 ? "Just now" : min + "m ago"));
    } catch (e) { console.warn("Cached compute failed:", e); }
  } else {
    showState("loading");
  }

  try {
    const raw = await fetchData();
    saveCache(raw);
    const D = compute(raw);
    render(D);
    showState("ready");
    setLiveStatus("normal", "Just now");
  } catch (err) {
    console.error("Load failed:", err);
    if (cached) {
      setLiveStatus("error", "Offline");
    } else {
      showError("Couldn't load or compute portfolio data. " + err.message, err.stack || err.message);
    }
  }
}

$("refreshBtn").addEventListener("click", async () => {
  const btn = $("refreshBtn"); btn.classList.add("spinning");
  setLiveStatus("normal", "Refreshing…");
  try {
    const raw = await fetchData();
    saveCache(raw);
    const D = compute(raw);
    render(D);
    showState("ready");
    setLiveStatus("normal", "Just now");
  } catch (err) {
    setLiveStatus("error", "Failed");
    if (!loadCache()) showError("Refresh failed. " + err.message, err.stack);
  } finally {
    setTimeout(() => btn.classList.remove("spinning"), 400);
  }
});

initLoad();
</script>
